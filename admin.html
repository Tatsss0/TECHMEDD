<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TECHMED — Admin Panel</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">

   <!-- Favicons -->
  <link href="logo512.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">
</head>
<body>
  <!-- ======= Header ======= -->
<header id="header" class="header d-flex align-items-center fixed-top">
  <div class="container-fluid d-flex align-items-center px-3">
    
    <!-- Left Side: Mobile toggle + Logo -->
    <div class="d-flex align-items-center me-auto">
      <!-- Mobile menu toggle -->
      <button id="sidebarToggle" class="btn btn-outline-secondary d-lg-none me-2" aria-label="Toggle menu">
        <i class="bi bi-list"></i>
      </button>

      <!-- Logo -->
      <a class="logo d-flex align-items-center">
        <h1 class="sitename">TECH<span>MED</span></h1>
      </a>
    </div>

    <!-- Center: Page Title (hidden on mobile) -->
    <h5 class="mb-0 fw-semibold d-none d-md-block position-absolute start-50 translate-middle-x">Admin Panel</h5>

    <!-- Right Side: Buttons (always on right) -->
    <div class="d-flex align-items-center gap-2 ms-auto">
      <!-- Profile Dropdown -->
      <div class="dropdown">
        <button class="btn btn-light border dropdown-toggle d-flex align-items-center" type="button" data-bs-toggle="dropdown" aria-expanded="false">

          <span id="headerUserName" class="fw-semibold">Admin</span>

        <ul class="dropdown-menu dropdown-menu-end">

          <li><hr class="dropdown-divider"></li>

      </div>
    </div>

</header>

<!-- ======= Sidebar ======= -->
<aside id="sidebar" class="sidebar shadow-sm">
  <div class="d-flex flex-column h-100 p-3">

    <!-- Navigation -->
    <ul class="nav nav-pills flex-column gap-1" id="sidebarNav">
      <li class="nav-item">
        <a href="#" id="navDoctors" class="nav-link active d-flex align-items-center" data-tab="doctors">
          <i class="bi bi-person-badge me-2"></i> Doctors
        </a>
      </li>
      <li class="nav-item">
        <a href="#" id="navSecretaries" class="nav-link d-flex align-items-center" data-tab="secretaries">
          <i class="bi bi-person-workspace me-2"></i> Secretaries

      </li>
      <li class="nav-item">
        <a href="#" id="navPatients" class="nav-link d-flex align-items-center" data-tab="patients">

      </li>
      <li class="nav-item">
        <a href="#" id="navCreateAccount" class="nav-link d-flex align-items-center" data-tab="create-account">

<!-- ======= Main ======= -->
<div class="main">
  <div class="container pt-4">
    <div id="notice" class="alert alert-warning d-none" role="alert"></div>

    <!-- Search Bar -->
    <div id="searchSection" class="mb-4">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0">
              <i class="bi bi-search text-muted"></i>
            </span>
            <input type="text" class="form-control border-start-0 ps-0" id="searchInput" placeholder="Search by name, email, or specialty...">
            <button class="btn btn-outline-secondary" type="button" id="clearSearch">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
          <div class="form-text text-center mt-2">
            <small id="searchHelpText">Search through doctors, secretaries, and patients</small>
          </div>
        </div>
      </div>
    </div>

    <div id="list" class="row gy-4"></div>
        
        <!-- Create Account Form -->
        <div id="create-account-form" class="d-none">
          <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title mb-4">
                    <i class="bi bi-person-plus me-2"></i>Create New Account
                  </h5>
                  <form id="accountForm">
                    <div class="mb-3">
                      <label for="accountType" class="form-label">Account Type</label>
                      <select class="form-select" id="accountType" required>
                        <option value="">Select account type</option>
                        <option value="doctor">Doctor</option>
                        <option value="secretary">Secretary</option>
                      </select>
                    </div>
                    <div class="mb-3">
                      <label for="fullName" class="form-label">Full Name</label>
                      <input type="text" class="form-control" id="fullName" required>
                    </div>
                    <div class="mb-3">
                      <label for="email" class="form-label">Email Address</label>
                      <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                      <label for="tempPassword" class="form-label">Temporary Password</label>
                      <div class="input-group">
                        <input type="text" class="form-control" id="tempPassword" required>
                        <button class="btn btn-outline-secondary" type="button" id="generatePassword">
                          <i class="bi bi-arrow-clockwise"></i> Generate
                        </button>
                      </div>
                      <div class="form-text">This temporary password will be sent to the user's email.</div>
                    </div>
                    <div class="mb-3" id="doctorFields" style="display: none;">
                      <label for="specialty" class="form-label">Specialty</label>
                      <input type="text" class="form-control" id="specialty" placeholder="e.g., Cardiology, Pediatrics">
                    </div>
                    <div class="mb-3" id="secretaryFields" style="display: none;">
                      <label for="assignedDoctor" class="form-label">Assigned Doctor</label>
                      <select class="form-select" id="assignedDoctor">
                        <option value="">Select a doctor</option>
                        <!-- Doctor options will be populated dynamically -->
                      </select>
                      <div class="form-text">Choose which doctor this secretary will handle.</div>
                    </div>
                    <div class="d-flex gap-2">
                      <button type="submit" class="btn btn-success">
                        <i class="bi bi-person-check me-2"></i>Create Account
                      </button>
                      <button type="button" class="btn btn-outline-secondary" id="sendCredentials">
                        <i class="bi bi-envelope me-2"></i>Send Credentials
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
  </div>
</div>

  <!-- Doctor View Modal -->
  <div class="modal fade" id="doctorViewModal" tabindex="-1" aria-labelledby="doctorViewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="doctorViewModalLabel">Doctor Information</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="doctorViewModalBody">
          <!-- Doctor information will be populated here -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    const adminFirebaseConfig = {

    };

    // Initialize admin app with unique name

    try {
      adminApp = firebase.app('adminApp');
    } catch (e) {

  <!-- Vendor JS (match site) -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <!-- Removed main.js as it expects elements not present in admin panel -->

  <script>
    const notice = document.getElementById('notice');
    const listEl = document.getElementById('list');
    const logoutBtn = document.getElementById('logoutBtn');
    const adminEmail = document.getElementById('adminEmail');
    const sidebarNavLinks = document.querySelectorAll('#sidebarNav .nav-link');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearch');
    const searchSection = document.getElementById('searchSection');
    const searchHelpText = document.getElementById('searchHelpText');

    let activeTab = 'doctors';
    let unsub = null;
    let allUsers = []; // Store all users for filtering


    function setNotice(msg, type = 'warning') {
      if (!notice) return;
      if (!msg) { notice.classList.add('d-none'); return; }
      notice.textContent = msg;
      notice.className = 'alert alert-' + type;
      notice.classList.remove('d-none');
    }

    function formatDate(ts) {
      try {
        if (!ts) return '-';
        const d = ts.toDate ? ts.toDate() : new Date(ts);
        return d.toLocaleString();
      } catch { return '-'; }
    }

    async function showDoctorModal(uid) {
      try {
        const doc = await db.collection('doctors').doc(uid).get();
        if (!doc.exists) {
          setNotice('Doctor not found', 'danger');
          return;
        }

        const data = doc.data();
        const modalTitle = document.getElementById('doctorViewModalLabel');
        const modalBody = document.getElementById('doctorViewModalBody');

        // Set modal title
        modalTitle.textContent = `${data.fullName || data.name || 'Doctor'} - Information`;

        // Format available days
        const formatAvailableDays = (days) => {
          if (!Array.isArray(days) || days.length === 0) return 'Not specified';
          return days.map(day => day.charAt(0).toUpperCase() + day.slice(1)).join(', ');
        };

        // Format available hours
        const formatAvailableHours = (hours) => {
          if (!hours || typeof hours !== 'object') return 'Not specified';
          const { start, end } = hours;
          if (!start || !end) return 'Not specified';
          return `${start} - ${end}`;
        };

        // Create user-friendly information display
        modalBody.innerHTML = `
          <div class="row">
            <div class="col-md-6">
              <h6 class="text-primary mb-3">
                <i class="bi bi-person-circle me-2"></i>Personal Information
              </h6>
              <div class="mb-2"><i class="bi bi-person me-2 text-muted"></i><strong>Full Name:</strong> ${data.fullName || data.name || 'Not provided'}</div>
              <div class="mb-2"><i class="bi bi-envelope me-2 text-muted"></i><strong>Email:</strong> ${data.email || 'Not provided'}</div>
              <div class="mb-2"><i class="bi bi-telephone me-2 text-muted"></i><strong>Phone:</strong> ${data.phone || 'Not provided'}</div>
              <div class="mb-2"><i class="bi bi-info-circle me-2 text-muted"></i><strong>Status:</strong> 
                <span class="badge bg-secondary">${(data.status || 'unknown').replace('_', ' ')}</span>
              </div>
              <div class="mb-2"><i class="bi bi-calendar-plus me-2 text-muted"></i><strong>Registration Date:</strong> ${formatDate(data.createdAt)}</div>
              <div class="mb-2"><i class="bi bi-clock-history me-2 text-muted"></i><strong>Last Updated:</strong> ${formatDate(data.updatedAt)}</div>
            </div>
            
            <div class="col-md-6">
              <h6 class="text-primary mb-3">
                <i class="bi bi-briefcase me-2"></i>Professional Information
              </h6>
              <div class="mb-2"><i class="bi bi-heart-pulse me-2 text-muted"></i><strong>Specialty:</strong> ${data.specialty || 'Not specified'}</div>
              <div class="mb-2"><i class="bi bi-card-text me-2 text-muted"></i><strong>License Number:</strong> ${data.licenseNumber || 'Not provided'}</div>
              <div class="mb-2"><i class="bi bi-trophy me-2 text-muted"></i><strong>Years of Experience:</strong> ${data.experience || 'Not specified'}</div>
              <div class="mb-2"><i class="bi bi-currency-dollar me-2 text-muted"></i><strong>Consultation Fee:</strong> ${data.consultationFee ? '₱' + data.consultationFee : 'Not specified'}</div>
            </div>
          </div>

          <hr class="my-4" style="border-color: #099aa7; opacity: 0.3;">

          <div class="row">
            <div class="col-md-6">
              <h6 class="text-primary mb-3">
                <i class="bi bi-building me-2"></i>Clinic Information
              </h6>
              <div class="mb-2"><i class="bi bi-hospital me-2 text-muted"></i><strong>Clinic Name:</strong> ${data.clinic?.name || 'Not provided'}</div>
              <div class="mb-2"><i class="bi bi-geo-alt me-2 text-muted"></i><strong>Clinic Address:</strong> ${data.clinic?.address || 'Not provided'}</div>
              <div class="mb-2"><i class="bi bi-telephone-fill me-2 text-muted"></i><strong>Clinic Phone:</strong> ${data.clinic?.phone || 'Not provided'}</div>
            </div>
            
            <div class="col-md-6">
              <h6 class="text-primary mb-3">
                <i class="bi bi-calendar-check me-2"></i>Availability
              </h6>
              <div class="mb-2"><i class="bi bi-calendar-week me-2 text-muted"></i><strong>Available Days:</strong> ${formatAvailableDays(data.availableDays)}</div>
              <div class="mb-2"><i class="bi bi-clock me-2 text-muted"></i><strong>Available Hours:</strong> ${formatAvailableHours(data.availableHours)}</div>
            </div>
          </div>

          ${data.about ? `
            <hr class="my-4" style="border-color: #099aa7; opacity: 0.3;">
            <h6 class="text-primary mb-3">
              <i class="bi bi-chat-text me-2"></i>About
            </h6>
            <div class="p-3 bg-light rounded-3">
              <p class="mb-0">${data.about}</p>
            </div>
          ` : ''}

          ${data.education ? `
            <hr class="my-4" style="border-color: #099aa7; opacity: 0.3;">
            <h6 class="text-primary mb-3">
              <i class="bi bi-mortarboard me-2"></i>Education
            </h6>
            <div class="p-3 bg-light rounded-3">
              <p class="mb-0">${data.education}</p>
            </div>
          ` : ''}
        `;

        // Show the modal
        const modal = new bootstrap.Modal(document.getElementById('doctorViewModal'));
        modal.show();

      } catch (error) {
        console.error('Error showing doctor modal:', error);
        setNotice('Failed to load doctor information', 'danger');
      }
    }

    // Search functionality
    function filterUsers(users, searchTerm) {
      if (!searchTerm.trim()) return users;
      
      const term = searchTerm.toLowerCase();
      return users.filter(u => {
        const data = u.data();
        
        // Get name based on role
        let name;
        if (data.role === 'patient' && (data.firstName || data.lastName)) {
          name = `${data.firstName || ''} ${data.lastName || ''}`.trim();
        } else {
          name = data.fullName || data.name || '';
        }
        
        const email = data.email || '';
        const specialty = data.specialty || '';
        const phone = data.phone || '';
        const assignedDoctorName = data.assignedDoctorName || '';
        
        // Search in multiple fields
        return name.toLowerCase().includes(term) ||
               email.toLowerCase().includes(term) ||
               specialty.toLowerCase().includes(term) ||
               phone.toLowerCase().includes(term) ||
               assignedDoctorName.toLowerCase().includes(term);
      });
    }

    function performSearch() {
      const searchTerm = searchInput.value;
      const filteredUsers = filterUsers(allUsers, searchTerm);
      render(filteredUsers);
      
      // Update search help text
      if (searchTerm.trim()) {
        const count = filteredUsers.length;
        const userType = activeTab === 'doctors' ? 'doctors' : activeTab === 'secretaries' ? 'secretaries' : 'patients';
        searchHelpText.textContent = `Found ${count} ${userType} matching "${searchTerm}"`;
      } else {
        updateSearchHelpText();
      }
    }

    function updateSearchHelpText() {
      const userType = activeTab === 'doctors' ? 'doctors' : activeTab === 'secretaries' ? 'secretaries' : activeTab === 'patients' ? 'patients' : 'users';
      searchHelpText.textContent = `Search through ${userType}`;
    }

    function render(users) {
      listEl.innerHTML = '';
      if (!users.length) {
        const userType = activeTab === 'doctors' ? 'doctors' : activeTab === 'secretaries' ? 'secretaries' : activeTab === 'patients' ? 'patients' : 'users';
        listEl.innerHTML = `<div class="col-12 text-center text-secondary">No ${userType} found</div>`;
        return;
      }
      for (const u of users) {
        const uid = u.id;
        const data = u.data();
        // Handle different name formats based on role
        let name;
        if (data.role === 'patient' && (data.firstName || data.lastName)) {
          name = `${data.firstName || ''} ${data.lastName || ''}`.trim();
        } else {
          name = data.fullName || data.name || '(no name)';
        }
        const email = data.email || '';
        const role = data.role || '';
        const status = data.status || 'active';
        const createdAt = formatDate(data.createdAt);
        
        // Role-specific information
        let roleInfo = '';
        if (activeTab === 'doctors') {
          const spec = data.specialty || '';
          const phone = data.phone || '';
          const clinic = data.clinic?.name || '';
          roleInfo = `
            <div><span class="muted">Specialty:</span> ${spec || '-'}</div>
            <div><span class="muted">Phone:</span> ${phone || '-'}</div>
            <div><span class="muted">Clinic:</span> ${clinic || '-'}</div>
          `;
        } else if (activeTab === 'secretaries') {
          const phone = data.phone || '';
          const assignedDoctorId = data.assignedDoctor || '';
          roleInfo = `
            <div><span class="muted">Phone:</span> ${phone || '-'}</div>
            <div><span class="muted">Assigned Doctor:</span> <span id="doctor-${uid}" class="text-primary">Loading...</span></div>
          `;
          
          // Fetch and display assigned doctor name
          if (assignedDoctorId) {
            fetchDoctorName(assignedDoctorId, uid);
          } else {
            setTimeout(() => {
              const doctorSpan = document.getElementById(`doctor-${uid}`);
              if (doctorSpan) doctorSpan.textContent = 'Not assigned';
            }, 100);
          }
        } else if (activeTab === 'patients') {
          const phone = data.phone || '';
          const birthDate = data.birthDate || '';
          const gender = data.gender || '';
          const verificationMethod = data.verificationMethod || '';
          const emailVerified = data.emailVerified ? 'Yes' : 'No';
          const phoneVerified = data.phoneVerified ? 'Yes' : 'No';
          roleInfo = `
            <div><span class="muted">Phone:</span> ${phone || '-'}</div>
            <div><span class="muted">Birth Date:</span> ${birthDate || '-'}</div>
            <div><span class="muted">Gender:</span> ${gender || '-'}</div>
            <div><span class="muted">Email Verified:</span> ${emailVerified}</div>
            <div><span class="muted">Phone Verified:</span> ${phoneVerified}</div>
            <div><span class="muted">Verification Method:</span> ${verificationMethod || '-'}</div>
          `;
        }

        const col = document.createElement('div');
        col.className = 'col-12 col-md-6 col-lg-4';
        col.innerHTML = `
          <div class="card h-100">
            <div class="card-body d-flex flex-column">
              <div class="d-flex align-items-start justify-content-between">
                <div>
                  <div class="fw-bold">${name}</div>
                  <div class="small muted">${email}</div>
                </div>
                <span class="badge ${status === 'active' ? 'bg-success' : 'bg-secondary'} badge-status">${status}</span>
              </div>
              <div class="mt-2 small">
                <div><span class="muted">Role:</span> ${role}</div>
                <div><span class="muted">Created:</span> ${createdAt}</div>
                ${roleInfo}
              </div>
              <div class="mt-auto pt-3 d-flex gap-2 flex-wrap">
                <button class="btn btn-outline-light btn-sm" data-action="view" data-uid="${uid}">View Details</button>
                <button class="btn btn-outline-warning btn-sm" data-action="reset-password" data-uid="${uid}">
                  <i class="bi bi-key"></i> Reset Password
                </button>
                <button class="btn btn-outline-danger btn-sm" data-action="deactivate" data-uid="${uid}">
                  <i class="bi bi-person-x"></i> ${status === 'active' ? 'Deactivate' : 'Activate'}
                </button>
              </div>
            </div>
          </div>
        `;
        listEl.appendChild(col);
      }

      listEl.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', onActionClick);
      });
    }

    async function onActionClick(e) {
      const btn = e.currentTarget;
      const action = btn.getAttribute('data-action');
      const uid = btn.getAttribute('data-uid');
      if (!uid) return;

      try {
        btn.disabled = true;
        if (action === 'reset-password') {
          await resetUserPassword(uid);
        } else if (action === 'deactivate') {
          await toggleUserStatus(uid);
        } else if (action === 'view') {
          await showUserModal(uid);
        }
      } catch (err) {
        console.error(err);
        setNotice(err.message || 'Action failed', 'danger');
      } finally {
        btn.disabled = false;
      }
    }

    function watchUsers() {
      if (unsub) { try { unsub(); } catch {} }
      
      if (activeTab === 'create-account') {
        document.getElementById('list').style.display = 'none';
        document.getElementById('create-account-form').classList.remove('d-none');
        searchSection.style.display = 'none';
        setNotice('');
        return;
      }
      
      document.getElementById('list').style.display = 'block';
      document.getElementById('create-account-form').classList.add('d-none');
      searchSection.style.display = 'block';
      
      // Clear search when switching tabs
      searchInput.value = '';
      updateSearchHelpText();
      
      setNotice('Loading ' + activeTab + '…', 'info');

      let q;
      if (activeTab === 'doctors') {
        q = db.collection('users').doc('doctors').collection('doctors');
      } else if (activeTab === 'secretaries') {
        q = db.collection('users').doc('secretaries').collection('secretaries');
      } else if (activeTab === 'patients') {
        q = db.collection('users').doc('patients').collection('patients');
      } else {
        // Fallback to main users collection if needed
        q = db.collection('users');
      }

      unsub = q.onSnapshot(snap => {
        setNotice('');
        const docs = [...snap.docs].sort((a, b) => {
          const ta = a.data()?.createdAt;
          const tb = b.data()?.createdAt;
          const ma = ta?.toMillis ? ta.toMillis() : (ta ? new Date(ta).getTime() : 0);
          const mb = tb?.toMillis ? tb.toMillis() : (tb ? new Date(tb).getTime() : 0);
          return mb - ma; // desc
        });
        
        // Store all users for filtering
        allUsers = docs;
        
        // Apply current search filter
        const searchTerm = searchInput.value;
        const filteredUsers = filterUsers(allUsers, searchTerm);
        render(filteredUsers);
      }, err => {
        console.error(err);
        setNotice(err.message || 'Failed to load users', 'danger');
      });
    }

    async function createUserAccount(userData) {
      const ts = firebase.firestore.FieldValue.serverTimestamp();
      
      try {
        console.log('Creating account with data:', userData);
        setNotice('Creating account...', 'info');
        
        // Validate required fields
        if (!userData.email || !userData.tempPassword || !userData.fullName || !userData.accountType) {

    async function resetUserPassword(uid) {
      try {
        const newPassword = generatePassword();
        
        // First, determine which subcollection the user is in
        let userDoc = null;
        let collectionPath = '';
        
        // Try doctors first
        try {
          userDoc = await db.collection('users').doc('doctors').collection('doctors').doc(uid).get();
          if (userDoc.exists) {
            collectionPath = 'users/doctors/doctors';
          }
        } catch (e) {}
        
        // Try secretaries if not found in doctors
        if (!userDoc || !userDoc.exists) {
          try {
            userDoc = await db.collection('users').doc('secretaries').collection('secretaries').doc(uid).get();
            if (userDoc.exists) {
              collectionPath = 'users/secretaries/secretaries';
            }
          } catch (e) {}
        }
        
        // Try patients if not found in secretaries
        if (!userDoc || !userDoc.exists) {
          try {
            userDoc = await db.collection('users').doc('patients').collection('patients').doc(uid).get();
            if (userDoc.exists) {
              collectionPath = 'users/patients/patients';
            }
          } catch (e) {}
        }
        
        if (!userDoc || !userDoc.exists) {
          throw new Error('User not found in any collection');
        }
        
        // Update user document with new temporary password
        const pathParts = collectionPath.split('/');
        await db.collection(pathParts[0]).doc(pathParts[1]).collection(pathParts[2]).doc(uid).update({
          tempPassword: newPassword,
          mustChangePassword: true,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        // Log admin action
        await db.collection('admin_actions').add({
          type: 'reset_password',
          targetUid: uid,
          adminUid: auth.currentUser.uid,
          at: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        setNotice(`Password reset. New temporary password: ${newPassword}`, 'success');
      } catch (error) {
        console.error('Error resetting password:', error);
        throw new Error('Failed to reset password');
      }
    }

    function generatePassword() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
      let password = '';
      for (let i = 0; i < 8; i++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return password;
    }

    async function populateDoctorDropdown() {
      try {
        const doctorsSnapshot = await db.collection('users').doc('doctors').collection('doctors').where('status', '==', 'active').get();
        const assignedDoctorSelect = document.getElementById('assignedDoctor');
        
        // Clear existing options except the first one
        assignedDoctorSelect.innerHTML = '<option value="">Select a doctor</option>';
        
        if (doctorsSnapshot.empty) {
          assignedDoctorSelect.innerHTML = '<option value="">No active doctors available</option>';
          return;
        }
        
        doctorsSnapshot.forEach(doc => {
          const doctorData = doc.data();
          const option = document.createElement('option');
          option.value = doc.id;
          option.textContent = `${doctorData.fullName || doctorData.name || 'Unknown'} - ${doctorData.specialty || 'General'}`;
          assignedDoctorSelect.appendChild(option);
        });
      } catch (error) {
        console.error('Error populating doctor dropdown:', error);
        const assignedDoctorSelect = document.getElementById('assignedDoctor');
        assignedDoctorSelect.innerHTML = '<option value="">Error loading doctors</option>';
      }
    }

    function bindTabs() {
      // Sidebar navigation
      sidebarNavLinks.forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          sidebarNavLinks.forEach(l => l.classList.remove('active'));
          link.classList.add('active');
          activeTab = link.getAttribute('data-tab');
          watchUsers();
          
          // Close sidebar on mobile after selection
          if (window.innerWidth <= 991) {
            sidebar.classList.remove('show');
            document.body.classList.remove('sidebar-open');
            sidebar.style.left = '-260px';
          }
        });
      });

      // Mobile sidebar toggle with direct style manipulation
      if (sidebarToggle) {
        sidebarToggle.addEventListener('click', () => {
          const isShown = sidebar.classList.contains('show');
          
          if (!isShown) {
            sidebar.classList.add('show');
            document.body.classList.add('sidebar-open');
            sidebar.style.left = '0px';
            sidebar.style.zIndex = '9999';
            sidebar.style.display = 'block';
          } else {
            sidebar.classList.remove('show');
            document.body.classList.remove('sidebar-open');
            sidebar.style.left = '-260px';
          }
        });
      }

      // Close sidebar on window resize
      window.addEventListener('resize', () => {
        if (window.innerWidth > 991) {
          sidebar.classList.remove('show');
          document.body.classList.remove('sidebar-open');
        }
      });

      // Search functionality
      if (searchInput) {
        searchInput.addEventListener('input', performSearch);
        searchInput.addEventListener('keyup', (e) => {
          if (e.key === 'Enter') {
            performSearch();
          }
        });
      }

      if (clearSearchBtn) {
        clearSearchBtn.addEventListener('click', () => {
          searchInput.value = '';
          performSearch();
          searchInput.focus();
        });
      }
    }

    // Require authenticated admin for access
    async function ensureAdmin(user) {
      try {
        let tries = 0; let role = '';
        while (tries < 10) {
          const u = await db.collection('users').doc(user.uid).get();
          role = u.exists ? (u.data().role || '') : '';
          if (role) break;
          // if special admin email, auto-set role and retry
          if ((user.email || '').toLowerCase() === 'admin@techmed.local') {
            try { await db.collection('users').doc(user.uid).set({ role: 'admin', email: user.email, uid: user.uid, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); } catch(_) {}
          }
          await new Promise(r => setTimeout(r, 500));
          tries++;
        }
        if (role !== 'admin') {
          try { await auth.signOut(); } catch(_) {}
          const url = new URL('./adminlogin.html', window.location.href);
          url.searchParams.set('err','not_admin');
          window.location.href = url.toString();
          return false;
        }
        // Update admin info in header dropdown
        adminEmail.textContent = user.email || '';
        const headerUserName = document.getElementById('headerUserName');
        if (headerUserName) {
          headerUserName.textContent = 'Admin';
        }
        return true;
      } catch (e) {
        console.error(e);
        window.location.href = './adminlogin.html';
        return false;
      }
    }
