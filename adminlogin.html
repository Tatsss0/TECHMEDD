<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TECHMED - Admin Login</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2c3e50" />
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Favicons -->
  <link href="logo512.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">
  
  <style>
    .password-wrapper { position: relative; }
    .password-wrapper input { width: 100%; padding-right: 40px; }
    .toggle-password { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #000000; font-size: 16px; }
    .brand { position: fixed; top: 16px; left: 16px; z-index: 50; font-weight: 800; letter-spacing: 1px; }
    .brand .tech { color: #ffffff; }
    .brand .med { color: var(--accent, #38bdf8); }
    .brand a { text-decoration: none; font-size: 28px; }
  </style>
</head>
<body>
  <div class="brand"><a ><span class="tech">TECH</span><span class="med">MED</span></a></div>


  <div class="login">
    <h1 class="log">ADMIN</h1>
    <p style="color: #ddd; text-align: center; font-size: 1.5rem; margin: 0.5rem 0;">Login as Admin User.</p>
    <p id="message" style="color: white; text-align: center; font-weight: bold;"></p>

    <form id="loginForm">
      <div class="user">
        <label for="username">Username</label>
        <input class="input" type="text" id="username" required />
      </div>
      <div class="pass password-wrapper">
        <label for="password">Password</label>
        <input class="input" type="password" id="password" required />
        <span class="toggle-password" onclick="togglePassword('password')"><i class="fa-solid fa-eye"></i></span>
        <h4 class="forgot" id="forgotPassword">Forgot Password?</h4>
      </div>
      <div>
        <button class="inside" id="loginBtn" type="submit">Login</button>
      </div>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  
  <script>
    // Initialize Firebase for admin login with separate app instance
    const adminFirebaseConfig = {
      apiKey: "AIzaSyCwCjmcUTTz8S34svqAxmhHmhO8QNnz5t8",
      authDomain: "t-echmed.firebaseapp.com",
      projectId: "t-echmed",
      storageBucket: "t-echmed.appspot.com",
      messagingSenderId: "290352510024",
      appId: "1:290352510024:web:c9e2fbdec8d36f35ca547d"
    };

    // Initialize admin app with unique name (same as admin.html)
    let adminApp;
    try {
      adminApp = firebase.app('adminApp');
    } catch (e) {
      adminApp = firebase.initializeApp(adminFirebaseConfig, 'adminApp');
    }

    // Use admin-specific instances
    const auth = adminApp.auth();
    const db = adminApp.firestore();
    
    console.log('Admin login Firebase initialized with separate app instance');
    const messageEl = document.getElementById('message');
    const formEl = document.getElementById('loginForm');
    const forgotEl = document.getElementById('forgotPassword');
    const loginBtn = document.getElementById('loginBtn');

    function msg(t){ if (messageEl) messageEl.textContent = t || ""; }

    async function isAdmin(uid){
      try { const u = await db.collection('users').doc(uid).get(); return u.exists && (u.data().role === 'admin'); } catch(_) { return false; }
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg("");
      const username = document.getElementById('username').value.trim();
      let password = document.getElementById('password').value.trim();
      // Fixed credentials support
      let email = '';
      if (username.toLowerCase() === 'admin') {
        email = 'admin@techmed.local';
      }
      if (!username || !password) { msg('All fields are required.'); return; }
      if (!email) { email = username; }
      try {
        loginBtn.disabled = true; loginBtn.textContent = 'Signing in…';
        const cred = await auth.signInWithEmailAndPassword(email, password);
        let ok = await isAdmin(cred.user.uid);
        if (!ok && (cred.user.email || '').toLowerCase() === 'admin@techmed.local') {
          try {
            await db.collection('users').doc(cred.user.uid).set({ role: 'admin', email: cred.user.email, uid: cred.user.uid, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
            ok = true;
          } catch(_) {}
        }
        if (!ok) { await auth.signOut(); msg('This account is not an admin.'); return; }
        window.location.replace('admin.html');
      } catch (error) {
        if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-login-credentials' || error.code === 'auth/invalid-credential') {
          // Auto-provision fixed admin account if using fixed credentials
          if (email === 'admin@techmed.local' && password === 'admin123') {
            try {
              const cred2 = await auth.createUserWithEmailAndPassword(email, password);
              await db.collection('users').doc(cred2.user.uid).set({
                uid: cred2.user.uid,
                email: email,
                role: 'admin',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              }, { merge: true });
              window.location.replace('admin.html');
              return;
            } catch (e2) {
              msg('Failed to auto-create admin. ' + (e2.message || '')); 
              return;
            }
          }
          msg('Admin account not found. Please create user admin@techmed.local with password admin123 and set users/{uid}.role = "admin".');
        }
        else if (error.code === 'auth/operation-not-allowed') {
          msg('Email/Password sign-in is disabled in Firebase Auth. Enable it in Firebase Console > Authentication > Sign-in method.');
        }
        else if (error.code === 'auth/wrong-password') msg('Incorrect password.');
        else if (error.code === 'auth/user-disabled') msg('User account is disabled.');
        else msg('Login failed: ' + (error.message || 'Unknown error'));
      } finally {
        loginBtn.disabled = false; loginBtn.textContent = 'Login';
      }
    });

    // Forgot password
    if (forgotEl) {
      forgotEl.addEventListener('click', async () => {
        const email = document.getElementById('username').value.trim();
        if (!email) { msg('Please enter your email to reset password.'); return; }
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg('Enter a valid email to reset password.'); return; }
        try {
          await auth.sendPasswordResetEmail(email);
          msg('✅ Password reset email sent!');
        } catch (error) {
          msg('⚠️ Error sending reset email: ' + (error.message || 'Unknown error'));
        }
      });
    }

    // If already signed in: redirect admins to admin.html
    auth.onAuthStateChanged(async (user) => {
      console.log('ADMIN LOGIN: Auth state changed, user:', user ? user.uid : 'null');
      if (!user) {
        console.log('ADMIN LOGIN: No user, staying on login page');
        return;
      }
      
      console.log('ADMIN LOGIN: Checking if user is admin...');
      let ok = await isAdmin(user.uid);
      console.log('ADMIN LOGIN: Is admin check result:', ok);
      
      if (!ok && (user.email || '').toLowerCase() === 'admin@techmed.local') {
        console.log('ADMIN LOGIN: Creating admin user document...');
        try {
          await db.collection('users').doc(user.uid).set({ role: 'admin', email: user.email, uid: user.uid, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
          ok = true;
          console.log('ADMIN LOGIN: Admin user document created');
        } catch(e) {
          console.error('ADMIN LOGIN: Error creating admin document:', e);
        }
      }
      
      if (ok) {
        console.log('ADMIN LOGIN: Admin verified, redirecting to admin.html');
        window.location.replace('admin.html');
      } else {
        console.log('ADMIN LOGIN: User is not admin, signing out');
        await auth.signOut();
      }
    });

    if (typeof auth === 'undefined' || !auth) {
      msg('Auth not initialized.');
    }

    // Eye icon toggle and brand color sync
    window.togglePassword = function(id){
      const input = document.getElementById(id);
      if (!input) return;
      const icon = input.parentElement.querySelector('.toggle-password i');
      input.type = input.type === 'password' ? 'text' : 'password';
      if (icon) { icon.classList.toggle('fa-eye'); icon.classList.toggle('fa-eye-slash'); }
    };
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.querySelector('.signn, .inside');
      const med = document.querySelector('.brand .med');
      if (btn && med) {
        const cs = getComputedStyle(btn);
        const bg = cs.backgroundColor || cs.borderColor || cs.color;
        if (bg) med.style.color = bg;
      }
      // surface error from redirected admin.html
      try {
        const u = new URL(window.location.href);
        const err = u.searchParams.get('err');
        if (err === 'not_admin') {
          msg('This account is not an admin. Please use the admin account.');
        }
      } catch(_) {}
    });
  </script>
</body>
</html>
