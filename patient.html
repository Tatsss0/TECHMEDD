  <style>
    /* Notification Item Styles */
    .notification-item {
      border-left: 4px solid transparent;
      padding: 1rem;
      margin-bottom: 0.5rem;
      border-radius: 0.5rem;
      background: #f8f9fa;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .notification-item:hover {
      background: #e9ecef;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .notification-item.unread {
      border-left-color: #099aa7;
      background: #e8f8f9;
    }
    .notification-item.unread:hover {
      background: #d4f1f4;
    }
    .notification-type-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #099aa7;
      color: white;
      font-size: 1.2rem;
    }
    .notification-unread-badge {
      width: 8px;
      height: 8px;
      background: #dc3545;
      border-radius: 50%;
      display: inline-block;
    }
    .notification-time {
      font-size: 0.75rem;
      color: #6c757d;
    }
    .notification-reason {
      background: #fff;
      border-left: 3px solid #099aa7;
      padding: 0.75rem;
      margin-top: 0.5rem;
      border-radius: 0.25rem;
      font-style: italic;
      color: #495057;
    }
  </style>
</head>

<body class="index-page">

      <!-- Right Side: Buttons (always on right) -->

    </div>

  <!-- Patient Records Modal -->

  <!-- Add Consultation Modal -->
  <div class="modal fade" id="addConsultModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen-sm-down">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Consultation</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="consultForm">
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Patient Name</label>
                <input type="text" id="cName" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Patient Email</label>
                <input type="email" id="cEmail" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Patient Phone</label>
                <input type="tel" id="cPhone" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Date</label>
                <input type="datetime-local" id="cDate" class="form-control" />
              </div>
              <div class="col-12">
                <label class="form-label">Notes</label>
                <textarea id="cNotes" class="form-control" rows="3" placeholder="Consultation notes"></textarea>
              </div>
              <div class="col-12">
                <label class="form-label">Prescription</label>
                <input type="text" id="cRx" class="form-control" placeholder="e.g. Metformin 500mg" />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>

          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>

    </div>

  <!-- Footer -->
  <footer class="border-top py-3 text-center small text-muted">© TECHMED</footer>

  <script>
  (function(){
    function toggleScrolled(){
      var body=document.body; var header=document.getElementById('header');
      if(!header) return;
      if(!(header.classList.contains('scroll-up-sticky')||header.classList.contains('sticky-top')||header.classList.contains('fixed-top'))) return;
      if(window.scrollY>100){ body.classList.add('scrolled'); } else { body.classList.remove('scrolled'); }
    }
    window.addEventListener('load', toggleScrolled);
    document.addEventListener('scroll', toggleScrolled);
  })();

  // Sidebar toggle for mobile
  (function(){
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    
    if (sidebarToggle && sidebar) {
      sidebarToggle.addEventListener('click', function() {
        sidebar.classList.toggle('show');
      });
    }
  })();

  // Notification System
  let notificationListener = null;
  let notificationModal = null;

  // Initialize notification modal
  const notificationModalEl = document.getElementById('notificationModal');
  if (notificationModalEl && window.bootstrap && window.bootstrap.Modal) {
    notificationModal = new window.bootstrap.Modal(notificationModalEl);
  }

  // Notification button click handler
  document.getElementById('notificationBtn')?.addEventListener('click', () => {
    if (notificationModal) notificationModal.show();
  });

  // Mark all as read button
  document.getElementById('markAllReadBtn')?.addEventListener('click', async () => {
    const uid = auth.currentUser?.uid;
    if (!uid || !db) return;
    
    try {
      const snapshot = await db.collection('notifications')
        .where('doctorId', '==', uid)
        .where('read', '==', false)
        .get();
      
      const batch = db.batch();
      snapshot.docs.forEach(doc => {
        batch.update(doc.ref, {
          read: true,
          readAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      });
      await batch.commit();
    } catch (e) {
      console.error('Failed to mark all as read:', e);
    }
  });

  // Helper function to get time ago
  function getTimeAgo(date) {
    const now = new Date();
    const diff = Math.floor((now - date) / 1000);
    
    if (diff < 60) return 'Just now';
    if (diff < 3600) return Math.floor(diff / 60) + ' minutes ago';
    if (diff < 86400) return Math.floor(diff / 3600) + ' hours ago';
    if (diff < 604800) return Math.floor(diff / 86400) + ' days ago';
    return date.toLocaleDateString();
  }

  // Load notifications function
  function loadNotifications() {
    const uid = auth.currentUser?.uid;
    if (!uid) return;

    const notificationListEl = document.getElementById('notificationList');
    const badgeEl = document.getElementById('notificationBadge');

    if (notificationListener) {
      try { notificationListener(); } catch(_) {}
    }

    notificationListener = db.collection('notifications')
      .where('doctorId', '==', uid)
      .where('type', 'in', ['appointment_booked', 'appointment_rescheduled', 'reschedule'])
      .limit(50)
      .onSnapshot((snapshot) => {
        if (!snapshot || snapshot.empty) {
          if (notificationListEl) {
            notificationListEl.innerHTML = `
              <div class="text-center py-5 text-muted">
                <i class="bi bi-bell fs-1"></i>
                <p class="mt-3">No notifications yet</p>
              </div>
            `;
          }
          if (badgeEl) badgeEl.classList.add('d-none');
          return;
        }

        const notifications = [];
        snapshot.forEach(doc => {
          notifications.push({ id: doc.id, ...doc.data() });
        });
        
        notifications.sort((a, b) => {
          const aTime = a.createdAt?.toDate?.() || new Date(0);
          const bTime = b.createdAt?.toDate?.() || new Date(0);
          return bTime - aTime;
        });

        const unreadCount = notifications.filter(n => !n.read).length;
        
        if (badgeEl) {
          if (unreadCount > 0) {
            badgeEl.textContent = unreadCount > 99 ? '99+' : String(unreadCount);
            badgeEl.classList.remove('d-none');
          } else {
            badgeEl.classList.add('d-none');
          }
        }

        if (notificationListEl) {
          notificationListEl.innerHTML = notifications.map(notif => {
            const isBooking = notif.type === 'appointment_booked';
            const isReschedule = notif.type === 'appointment_rescheduled' || notif.type === 'reschedule';
            
            const icon = isBooking
              ? 'calendar-plus-fill'
              : isReschedule
              ? 'calendar-x-fill'
              : 'bell-fill';
            const title = isBooking
              ? 'New Appointment Booked'
              : isReschedule
              ? 'Appointment Rescheduled'
              : 'Notification';
            
            const timeAgo = getTimeAgo(notif.createdAt?.toDate ? notif.createdAt.toDate() : new Date());
            const unreadClass = !notif.read ? 'unread' : '';
            
            return `
              <div class="notification-item ${unreadClass}" data-notif-id="${notif.id}">
                <div class="d-flex">
                  <div class="notification-type-icon me-3">
                    <i class="bi bi-${icon}"></i>
                  </div>
                  <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-start mb-1">
                      <h6 class="mb-0 fw-semibold">${title}</h6>
                      ${!notif.read ? '<span class="notification-unread-badge"></span>' : ''}
                    </div>
                    <p class="mb-2 text-secondary">${notif.message || ''}</p>
                    ${notif.patientName ? `<div class="small"><strong>Patient:</strong> ${notif.patientName}</div>` : ''}
                    ${notif.oldDate ? `<div class="small"><strong>Old Date:</strong> ${notif.oldDate} at ${notif.oldTime || 'N/A'}</div>` : ''}
                    ${notif.newDate ? `<div class="small"><strong>New Date:</strong> ${notif.newDate} at ${notif.newTime || 'N/A'}</div>` : ''}
                    ${notif.reason ? `<div class="notification-reason mt-2"><i class="bi bi-chat-quote me-2"></i><strong>Reason:</strong> ${notif.reason}</div>` : ''}
                    <div class="notification-time mt-2">${timeAgo}</div>
                  </div>
                </div>
              </div>
            `;
          }).join('');

          notificationListEl.querySelectorAll('[data-notif-id]').forEach(item => {
            item.addEventListener('click', async () => {
              const notifId = item.getAttribute('data-notif-id');
              try {
                await db.collection('notifications').doc(notifId).update({
                  read: true,
                  readAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                item.classList.remove('border-primary', 'bg-white');
                item.classList.add('bg-light');
                item.querySelector('.badge')?.remove();
              } catch(e) {
                console.warn('Failed to mark notification as read', e);
              }
            });
          });
        }
      }, (error) => {
        console.error('Notification listener error:', error);
        if (notificationListEl) {
          notificationListEl.innerHTML = `
            <div class="text-center py-5 text-danger">
              <i class="bi bi-exclamation-triangle fs-1"></i>
              <p class="mt-3">Failed to load notifications</p>
              <small>${error.message || 'Unknown error'}</small>
            </div>
          `;
        }
      });
  }

  // Call loadNotifications after auth state is confirmed
  auth.onAuthStateChanged(user => {
    if (user) {
      loadNotifications();
    }
  });
  </script>
