<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TECHMED — Doctor Login</title>
  <link rel="stylesheet" href="login.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .password-wrapper { position: relative; }
    .password-wrapper input { width: 100%; padding-right: 40px; }
    .toggle-password { position: absolute; right: 10px; top: 48%; transform: translateY(-50%); cursor: pointer; color: #000000; font-size: 16px; }
    /* Top-left brand */
    .brand { position: fixed; top: 16px; left: 16px; z-index: 50; font-weight: 800; letter-spacing: 1px; }
    .brand .tech { color: #ffffff; }
    .brand .med { color: var(--accent, #197c2e); }
    .brand a { text-decoration: none; font-size: 28px; }
    /* Reduce gap between heading and form */
    .login .log { margin-bottom: 0.2rem; }
    .login form { margin-top: 0; }
    .login #message { margin: 0.3rem 0; }
  </style>
</head>
<body>

  <div class="brand"><a ><span class="tech">TECH</span><span class="med">MED</span></a></div>


  <div class="login">
    <h1 class="log">DOCTOR LOGIN</h1>
    <p id="message" style="color: white; text-align: center; font-weight: bold;"></p>

    <form id="loginForm">
      <div class="user">
        <label for="identifier">Email or Phone Number</label>
        <input class="input" type="text" id="identifier" autocomplete="username" placeholder="e.g. doc@email.com or 0912..." required />
      </div>
      <div class="pass password-wrapper">
        <label for="password">Password</label>
        <input class="input" type="password" id="password" required />
        <span class="toggle-password" onclick="togglePassword('password')"><i class="fa-solid fa-eye"></i></span>
        <div style="display:flex; justify-content: flex-end; align-items:center; margin-top:8px;">
          <a href="reset-password.html" style="color:#fff; font-size:14px; text-decoration:underline;">Forgot password?</a>
        </div>
      </div>
      <div>
        <button class="inside" type="submit">Log In</button>
      </div>
      <h2 class="second" style="font-size: 0.9rem; margin-top: 1rem;"><strong>Don't have an Account? <a class="conti" href="docreg.html" style="font-size: 0.85rem;">Sign In</a></strong></h2>
      <div class="mt-3" style="margin-top:12px;">
        <div id="alert" class="alert d-none" role="alert"></div>
      </div>
    </form>

    
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="./firebase-init.js"></script>

  <script>
  const form = document.getElementById('loginForm');
  const alertEl = document.getElementById('alert');
  const auth = firebase.auth();
  const db = firebase.firestore();
  const identifierEl = document.getElementById('identifier');

  function showAlert(msg, type = 'danger') {
    alertEl.textContent = msg;
    alertEl.className = 'alert alert-' + type;
  }

  async function getRole(uid) {
    try {
      const u = await db.collection('users').doc(uid).get();
      if (u.exists && u.data()?.role) return u.data().role;
      if ((await db.collection('doctors').doc(uid).get()).exists) return 'doctor';
      if ((await db.collection('patients').doc(uid).get()).exists) return 'patient';
      return null;
    } catch { return null; }
  }

  // If already signed in: allow doctors, sign out others
  auth.onAuthStateChanged(async (user) => {
    if (!user) return; // show form
    const role = await getRole(user.uid);
    if (role === 'doctor') {
      window.location.href = 'docpov.html';
      return;
    }
    await auth.signOut(); // signed in as patient/unknown, require doctor login here
    showAlert('This account is not a doctor. Please use the patient login.', 'info');
  });

  function isEmail(value){ return /.+@.+\..+/.test(value); }
  function normalizePhoneKey(input){
    if (!input) return null;
    const digits = input.replace(/\D/g,'');
    if (digits.length === 11 && digits.startsWith('09')) return digits;
    if (digits.length === 12 && digits.startsWith('63')) return '0' + digits.slice(2);
    if (digits.length === 10 && digits.startsWith('9')) return '0' + digits;
    return null;
  }

  async function resolveEmailFromIdentifier(identifier){
    if (!identifier) return null;
    if (isEmail(identifier)) return identifier.toLowerCase();

    const phoneKey = normalizePhoneKey(identifier);
    if (!phoneKey) {
      showAlert('Enter a valid PH phone number (e.g., 09123456789)', 'warning');
      return null;
    }
    try {
      const docSnap = await db.collection('phone_index').doc(phoneKey).get();
      if (!docSnap.exists) {
        showAlert('Phone number not found. Please register first.', 'warning');
        return null;
      }
      const data = docSnap.data() || {};
      if (!data.email) {
        showAlert('Phone is missing an associated email. Contact support.', 'warning');
        return null;
      }
      return data.email;
    } catch (err) {
      console.error(err);
      showAlert('Failed to look up phone number. Try again.', 'warning');
      return null;
    }
  }

  window.togglePassword = function(id){
    const input = document.getElementById(id);
    if (!input) return;
    const icon = input.parentElement.querySelector('.toggle-password i');
    input.type = input.type === 'password' ? 'text' : 'password';
    if (icon) { icon.classList.toggle('fa-eye'); icon.classList.toggle('fa-eye-slash'); }
  };

  // Match MED color to button accent
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.querySelector('.signn, .inside');
    const med = document.querySelector('.brand .med');
    if (btn && med) {
      const cs = getComputedStyle(btn);
      const bg = cs.backgroundColor || cs.borderColor || cs.color;
      if (bg) med.style.color = bg;
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const identifier = identifierEl.value.trim();
    const password = document.getElementById('password').value;

    try {
      await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
      const email = await resolveEmailFromIdentifier(identifier);
      if (!email) return;
      const cred = await auth.signInWithEmailAndPassword(email, password);
      const role = await getRole(cred.user.uid);
      if (role !== 'doctor') {
        await auth.signOut();
        showAlert('This account is not a doctor. Use the patient login.', 'danger');
        return;
      }
      showAlert('Login successful. Redirecting…', 'success');
      window.location.href = 'docpov.html';
    } catch (err) {
      console.error(err);
      showAlert(err.message || 'Login failed');
    }
  });

  // forgot password handled via reset-password.html
</script>
</body>
</html>
