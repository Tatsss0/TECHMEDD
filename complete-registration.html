<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TECHMED - Complete Registration</title>
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .brand { position: fixed; top: 16px; left: 16px; z-index: 50; font-weight: 800; letter-spacing: 1px; }
    .brand .tech { color: #ffffff; }
    .brand .med { color: var(--accent, #099aa7); }
    .brand a { text-decoration: none; font-size: 28px; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; color: white; font-weight: bold; }
    .form-group input, .form-group textarea, .form-group select { 
      width: 100%; 
      padding: 0.75rem; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      font-size: 1rem;
    }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .hidden { display: none; }
    .success-message { color: #28a745; text-align: center; font-weight: bold; }
    .error-message { color: #dc3545; text-align: center; font-weight: bold; }
    .info-message { color: #17a2b8; text-align: center; font-weight: bold; }
    
    /* Password toggle styling */
    .password-wrapper { 
      position: relative; 
      display: flex;
      align-items: center;
    }
    .password-wrapper input { 
      width: 100%; 
      padding-right: 45px; 
    }
    .toggle-password { 
      position: absolute; 
      right: 12px; 
      cursor: pointer; 
      color: #666; 
      font-size: 16px;
      user-select: none;
      z-index: 10;
    }
    .toggle-password:hover { 
      color: #333; 
    }
  </style>
</head>

<body>
  <div class="brand"><a><span class="tech">TECH</span><span class="med">MED</span></a></div>

  <div class="login">
    <h1 class="log">Complete Your Registration</h1>
    <p id="message" style="color: white; text-align: center; font-weight: bold;"></p>
    
    <div id="loadingSection">
      <p class="info-message">Loading your information...</p>
    </div>

    <div id="verificationSection" class="hidden">
      <p class="info-message">Please verify your email address first.</p>
      <button id="resendVerification" class="inside">Resend Verification Email</button>
      <button id="checkVerification" class="inside" style="margin-top: 10px;">I've Verified My Email</button>
    </div>

    <form id="registrationForm" class="hidden">
      <!-- Step 1: Basic Information -->
      <div id="step1" class="form-step">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" required readonly>
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required readonly>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="e.g., 09123456789" inputmode="numeric" pattern="09[0-9]{9}" maxlength="11" oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="password-wrapper">
            <input type="password" id="newPassword" required minlength="6">
            <span class="toggle-password" onclick="togglePassword('newPassword')">
              <i class="fa-solid fa-eye"></i>
            </span>
          </div>
          <small style="color: #ccc;">Must be at least 6 characters</small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" required>
            <span class="toggle-password" onclick="togglePassword('confirmPassword')">
              <i class="fa-solid fa-eye"></i>
            </span>
          </div>
        </div>

        <!-- Step 1 Navigation -->
        <div class="form-group" style="display: flex; gap: 10px; margin-top: 1.5rem;">
          <button type="button" id="nextBtn1" class="inside" style="flex: 1;">Next</button>
        </div>
      </div>

      <!-- Step 2: Professional Information (Doctor) -->
      <div id="step2Doctor" class="form-step hidden">
        <div class="form-group">
          <label for="specialty">Medical Specialty</label>
          <input type="text" id="specialty" placeholder="e.g., Endocrinologist" required>
        </div>
        
        <div class="form-group">
          <label for="yearsExperience">Years of Experience</label>
          <input type="number" id="yearsExperience" min="0" step="1" required>
        </div>
        
        <div class="form-group">
          <label for="licenseNumber">Medical License Number</label>
          <input type="text" id="licenseNumber" placeholder="Medical license number" required>
        </div>
        
        <div class="form-group">
          <label for="licenseExpiry">License Expiry</label>
          <input type="date" id="licenseExpiry" required>
        </div>

        <!-- Step 2 Navigation -->
        <div class="form-group" style="display: flex; gap: 10px; margin-top: 1.5rem;">
          <button type="button" id="backBtn1" class="inside" style="flex: 1; background-color: #6c757d;">Back</button>
          <button type="button" id="nextBtn2" class="inside" style="flex: 1;">Next</button>
        </div>
      </div>

      <!-- Step 3: Additional Information (Doctor) -->
      <div id="step3Doctor" class="form-step hidden">
        <div class="form-group">
          <label for="clinicName">Clinic/Hospital</label>
          <input type="text" id="clinicName" placeholder="Clinic or hospital name">
        </div>
        
        <div class="form-group">
          <label for="clinicAddress">Clinic Address</label>
          <input type="text" id="clinicAddress" placeholder="Full clinic address">
        </div>
        
        <div class="form-group">
          <label for="country">Country</label>
          <input type="text" id="country" placeholder="e.g., Philippines">
        </div>
        
        <div class="form-group">
          <label for="about">About / Bio</label>
          <textarea id="about" rows="3" placeholder="Short bio about yourself and your practice"></textarea>
        </div>
        
        <!-- Step 3 Navigation -->
        <div class="form-group" style="display: flex; gap: 10px; margin-top: 1.5rem;">
          <button type="button" id="backBtn2" class="inside" style="flex: 1; background-color: #6c757d;">Back</button>
          <button type="submit" class="inside" style="flex: 1;">Complete Registration</button>
        </div>
      </div>

      <!-- Step 2: Secretary Information -->
      <div id="step2Secretary" class="form-step hidden">
        <div class="form-group">
          <label for="assignedDoctor">Assigned Doctor</label>
          <select id="assignedDoctor" required>
            <option value="">Select Doctor</option>
          </select>
          <small style="color: #ccc;">Loading available doctors...</small>
        </div>
        
        <!-- Secretary Navigation -->
        <div class="form-group" style="display: flex; gap: 10px; margin-top: 1.5rem;">
          <button type="button" id="backBtnSecretary" class="inside" style="flex: 1; background-color: #6c757d;">Back</button>
          <button type="submit" class="inside" style="flex: 1;">Complete Registration</button>
        </div>
      </div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, updatePassword, sendEmailVerification
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
    import { 
      getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs 
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCwCjmcUTTz8S34svqAxmhHmhO8QNnz5t8",
      authDomain: "t-echmed.firebaseapp.com",
      projectId: "t-echmed",
      storageBucket: "t-echmed.appspot.com",
      messagingSenderId: "290352510024",
      appId: "1:290352510024:web:c9e2fbdec8d36f35ca547d"
    };

    // Use default app instance to maintain auth persistence
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    console.log('Complete registration Firebase initialized with default app instance');

    const messageEl = document.getElementById("message");
    const loadingSection = document.getElementById("loadingSection");
    const verificationSection = document.getElementById("verificationSection");
    const registrationForm = document.getElementById("registrationForm");
    
    // Step elements
    const step1 = document.getElementById("step1");
    const step2Doctor = document.getElementById("step2Doctor");
    const step3Doctor = document.getElementById("step3Doctor");
    const step2Secretary = document.getElementById("step2Secretary");

    function msg(text, type = 'info') {
      messageEl.textContent = text || "";
      messageEl.className = type === 'error' ? 'error-message' : 
                           type === 'success' ? 'success-message' : 'info-message';
    }

    function showSection(section) {
      [loadingSection, verificationSection, registrationForm].forEach(s => s.classList.add('hidden'));
      section.classList.remove('hidden');
    }

    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const uid = urlParams.get('uid');
    const role = urlParams.get('role');

    if (!uid || !role) {
      msg("Invalid registration link. Please contact admin.", 'error');
    }

    let userData = null;

    async function loadUserData() {
      try {
        const collectionPath = role === 'doctor' ? 'users/doctors/doctors' : 'users/secretaries/secretaries';
        const userDoc = await getDoc(doc(db, collectionPath, uid));
        
        if (!userDoc.exists()) {
          msg("User not found. Please contact admin.", 'error');
          return;
        }

        userData = userDoc.data();
        
        // Fill in readonly fields
        document.getElementById('fullName').value = userData.fullName || '';
        document.getElementById('email').value = userData.email || '';
        
        // Show Step 1 initially for both roles
        showSection(registrationForm);
        showStep(step1);
        
        // Pre-fill any existing data
        if (role === 'doctor') {
          document.getElementById('specialty').value = userData.specialty || '';
        } else if (role === 'secretary') {
          await loadDoctors();
        }

        // Check verification status
        await checkVerificationStatus();
        
      } catch (error) {
        console.error('Error loading user data:', error);
        msg("Error loading user data. Please try again.", 'error');
      }
    }

    async function checkVerificationStatus() {
      const user = auth.currentUser;
      if (!user) {
        msg("Please log in first.", 'error');
        window.location.href = 'login.html';
        return;
      }

      await user.reload(); // Refresh user data
      
      if (!user.emailVerified) {
        showSection(verificationSection);
        msg("Please verify your email address to continue.");
      } else if (userData.firstLogin || !userData.registrationComplete) {
        showSection(registrationForm);
        msg("Please complete your registration information.");
      } else {
        msg("Registration already completed. Redirecting...", 'success');
        setTimeout(() => {
          window.location.href = role === 'doctor' ? 'index.html' : 'index.html';
        }, 2000);
      }
    }

    async function loadDoctors() {
      try {
        const doctorsQuery = query(
          collection(db, 'users', 'doctors', 'doctors'),
          where('status', '==', 'active')
        );
        const doctorsSnapshot = await getDocs(doctorsQuery);
        
        const select = document.getElementById('assignedDoctor');
        select.innerHTML = '<option value="">Select a doctor</option>';
        
        doctorsSnapshot.forEach(doc => {
          const doctor = doc.data();
          const option = document.createElement('option');
          option.value = doc.id;
          option.textContent = `${doctor.fullName} - ${doctor.specialty || 'General'}`;
          if (doc.id === userData.assignedDoctor) {
            option.selected = true;
          }
          select.appendChild(option);
        });
      } catch (error) {
        console.error('Error loading doctors:', error);
        msg("Error loading doctors list.", 'error');
      }
    }

    // Event listeners
    document.getElementById('resendVerification').addEventListener('click', async () => {
      try {
        await sendEmailVerification(auth.currentUser);
        msg("Verification email sent. Please check your inbox.", 'success');
      } catch (error) {
        msg("Error sending verification email: " + error.message, 'error');
      }
    });

    document.getElementById('checkVerification').addEventListener('click', async () => {
      await checkVerificationStatus();
    });

    registrationForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Validate all required fields based on role
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const phone = document.getElementById('phone').value;

      if (!phone || !newPassword || !confirmPassword) {
        msg("Please fill in all basic information fields.", 'error');
        return;
      }

      if (newPassword !== confirmPassword) {
        msg("Passwords do not match.", 'error');
        return;
      }

      if (newPassword.length < 6) {
        msg("Password must be at least 6 characters.", 'error');
        return;
      }

      // Role-specific validation
      if (role === 'doctor') {
        const specialty = document.getElementById('specialty').value.trim();
        const experience = document.getElementById('yearsExperience').value;
        const license = document.getElementById('licenseNumber').value.trim();
        const expiry = document.getElementById('licenseExpiry').value;
        
        if (!specialty || !experience || !license || !expiry) {
          msg("Please fill in all required professional fields.", 'error');
          return;
        }
      } else if (role === 'secretary') {
        const assignedDoctor = document.getElementById('assignedDoctor').value;
        if (!assignedDoctor) {
          msg("Please select an assigned doctor.", 'error');
          return;
        }
      }

      try {
        msg("Updating your information...", 'info');
        
        // Update password
        await updatePassword(auth.currentUser, newPassword);
        
        // Prepare update data
        const updateData = {
          phone: phone,
          emailVerified: true,
          registrationComplete: true,
          firstLogin: false,
          status: 'active',
          updatedAt: new Date()
        };

        // Add role-specific data
        if (role === 'doctor') {
          updateData.specialty = document.getElementById('specialty').value;
          updateData.licenseNumber = document.getElementById('licenseNumber').value;
          updateData.yearsExperience = parseInt(document.getElementById('yearsExperience').value) || 0;
          updateData.licenseExpiry = document.getElementById('licenseExpiry').value;
          updateData.clinicName = document.getElementById('clinicName').value;
          updateData.clinicAddress = document.getElementById('clinicAddress').value;
          updateData.country = document.getElementById('country').value;
          updateData.about = document.getElementById('about').value;
        } else if (role === 'secretary') {
          updateData.assignedDoctor = document.getElementById('assignedDoctor').value;
        }

        // Update Firestore document
        const collectionPath = role === 'doctor' ? 'users/doctors/doctors' : 'users/secretaries/secretaries';
        await updateDoc(doc(db, collectionPath, uid), updateData);

        // Different redirect logic for doctors vs secretaries
        if (role === 'doctor') {
          msg("Registration completed successfully! Redirecting to login page...", 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 2000);
        } else if (role === 'secretary') {
          msg("Registration completed successfully! Please login again to access your dashboard.", 'success');
          // Sign out the secretary and redirect to login
          setTimeout(async () => {
            try {
              await auth.signOut();
            } catch (e) {
              console.log('Signout error (non-critical):', e);
            }
            window.location.href = 'index.html';
          }, 3000);
        }

      } catch (error) {
        console.error('Error completing registration:', error);
        msg("Error completing registration: " + error.message, 'error');
      }
    });

    // Step Navigation Logic
    function showStep(stepElement) {
      // Hide all steps
      [step1, step2Doctor, step3Doctor, step2Secretary].forEach(step => {
        if (step) step.classList.add('hidden');
      });
      // Show target step
      if (stepElement) stepElement.classList.remove('hidden');
      
      // Manage required attributes - only require fields in visible steps
      manageRequiredFields(stepElement);
    }
    
    function manageRequiredFields(visibleStep) {
      // Remove required from all form fields first
      const allInputs = registrationForm.querySelectorAll('input, select, textarea');
      allInputs.forEach(input => {
        if (input.hasAttribute('data-originally-required')) {
          // Restore original required state
          if (input.getAttribute('data-originally-required') === 'true') {
            input.setAttribute('required', '');
          } else {
            input.removeAttribute('required');
          }
        } else {
          // Store original required state
          input.setAttribute('data-originally-required', input.hasAttribute('required'));
        }
      });
      
      // Only keep required on visible step fields
      if (visibleStep) {
        const visibleInputs = visibleStep.querySelectorAll('input[data-originally-required="true"], select[data-originally-required="true"], textarea[data-originally-required="true"]');
        visibleInputs.forEach(input => {
          input.setAttribute('required', '');
        });
        
        // Remove required from hidden step fields
        const hiddenInputs = registrationForm.querySelectorAll('input, select, textarea');
        hiddenInputs.forEach(input => {
          if (!visibleStep.contains(input)) {
            input.removeAttribute('required');
          }
        });
      }
    }

    // Step 1 -> Step 2 (Next button)
    document.getElementById('nextBtn1')?.addEventListener('click', () => {
      // Validate Step 1 fields
      const phone = document.getElementById('phone').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (!phone || !newPassword || !confirmPassword) {
        msg("Please fill in all required fields.", 'error');
        return;
      }
      
      if (newPassword !== confirmPassword) {
        msg("Passwords do not match.", 'error');
        return;
      }
      
      if (newPassword.length < 6) {
        msg("Password must be at least 6 characters.", 'error');
        return;
      }
      
      // Move to appropriate Step 2
      if (role === 'doctor') {
        showStep(step2Doctor);
      } else if (role === 'secretary') {
        showStep(step2Secretary);
      }
    });

    // Step 2 -> Step 3 (Doctor Next button)
    document.getElementById('nextBtn2')?.addEventListener('click', () => {
      // Validate Step 2 fields for doctor
      const specialty = document.getElementById('specialty').value.trim();
      const experience = document.getElementById('yearsExperience').value;
      const license = document.getElementById('licenseNumber').value.trim();
      const expiry = document.getElementById('licenseExpiry').value;
      
      if (!specialty || !experience || !license || !expiry) {
        msg("Please fill in all required professional fields.", 'error');
        return;
      }
      
      showStep(step3Doctor);
    });

    // Back buttons
    document.getElementById('backBtn1')?.addEventListener('click', () => showStep(step1));
    document.getElementById('backBtn2')?.addEventListener('click', () => showStep(step2Doctor));
    document.getElementById('backBtnSecretary')?.addEventListener('click', () => showStep(step1));

    // Event listeners
    document.getElementById('resendVerification').addEventListener('click', async () => {
      try {
        await sendEmailVerification(auth.currentUser);
        msg("Verification email sent. Please check your inbox.", 'success');
      } catch (error) {
        msg("Error sending verification email: " + error.message, 'error');
      }
    });

    document.getElementById('checkVerification').addEventListener('click', async () => {
      await checkVerificationStatus();
    });

    // Initialize
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        msg("Please log in first.", 'error');
        window.location.href = 'login.html';
        return;
      }

      if (user.uid !== uid) {
        msg("Invalid user session. Please log in again.", 'error');
        window.location.href = 'login.html';
        return;
      }

      await loadUserData();
    });

    // Password toggle function
    window.togglePassword = function(fieldId) {
      const input = document.getElementById(fieldId);
      const icon = input.parentElement.querySelector('.toggle-password i');
      
      if (!input || !icon) return;
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    };
  </script>
</body>
</html>
